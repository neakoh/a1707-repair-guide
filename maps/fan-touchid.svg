<text x="400" y="645" fill="#77777e" font-size="12" text-anchor="middle">FRONT EDGE (you)</text>
<circle cx="38" cy="680" r="7" fill="none" stroke="#ff9e80" stroke-width="3"/><text x="52" y="685" fill="#e6e6ea" font-size="14">Fan screws (about 3, T5): one compartment</text>
<text x="30" y="710" fill="#9a9aa2" font-size="13">Its cable came free with the logic board. Lift the fan straight out; the other fan stays.</text>
