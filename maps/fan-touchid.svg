<text x="635" y="259" fill="#5d5d64" font-size="11" text-anchor="middle">leave</text>
<g stroke="#ff9e80" stroke-width="3" fill="none"><circle cx="110" cy="200" r="9"/><circle cx="225" cy="196" r="9"/><circle cx="140" cy="328" r="9"/></g>
<g fill="#ff9e80"><circle cx="110" cy="200" r="2.5"/><circle cx="225" cy="196" r="2.5"/><circle cx="140" cy="328" r="2.5"/></g>
<rect x="44" y="118" width="84" height="56" rx="5" fill="#ffffff10" stroke="#e6e6ea" stroke-dasharray="5 3"/>
<text x="136" y="132" fill="#e6e6ea" font-size="12">Touch ID corner (next steps)</text>
<rect x="242" y="392" width="153" height="160" rx="6" fill="#2a2a2e" stroke="#46464c"/>
<rect x="405" y="392" width="153" height="160" rx="6" fill="#2a2a2e" stroke="#46464c"/>
